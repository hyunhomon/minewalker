name: "[Fix] 버그 수정"
description: 버그 리포트 및 수정
labels: ["fix"]
body:
  - type: textarea
    id: bug
    attributes:
      label: 버그 설명
      placeholder: 어떤 버그인지 설명
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      placeholder: 정상적으로 동작해야 하는 방식
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 관련 파일
      placeholder: 관련 씬/스크립트/프리팹
